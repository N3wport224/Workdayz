<!doctype html>
<html>
<head><meta charset="utf-8"><title>Apply — Tenant 2 (international labels)</title></head>
<body>
  <!-- A second Workday tenant flavor (item 86): international / alternate
       labels plus the fields added in the 100-item build — preferred name,
       work phone, and a references block. Looks like an application form to
       looksLikeApplicationForm via the button + labeled inputs. -->
  <h1>Postuler — My Information</h1>
  <button>Save and Continue</button>

  <div>
    <label for="t2first">Prénom *</label>
    <input id="t2first" type="text" />
  </div>
  <div>
    <label for="t2last">Apellido *</label>
    <input id="t2last" type="text" />
  </div>
  <div>
    <label for="t2pref">Preferred First Name</label>
    <input id="t2pref" type="text" />
  </div>
  <div>
    <label for="t2email">Email Address *</label>
    <input id="t2email" type="email" />
  </div>
  <div>
    <label for="t2mobile">Mobile Phone *</label>
    <input id="t2mobile" type="tel" />
  </div>
  <div>
    <label for="t2work">Work Phone</label>
    <input id="t2work" type="tel" />
  </div>

  <h2>Reference</h2>
  <div>
    <label for="t2refname">Reference Name</label>
    <input id="t2refname" type="text" />
  </div>
  <div>
    <label for="t2refemail">Reference Email</label>
    <input id="t2refemail" type="email" />
  </div>
  <div>
    <label for="t2refrel">Relationship to You</label>
    <input id="t2refrel" type="text" />
  </div>
</body>
</html>
