<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mock Workday — My Experience (empty sections)</title>
</head>
<body>
  <!-- Mimics Xcel's "My Experience" step: each section starts EMPTY with a
       bare "Add" button, and all three Add buttons have identical text. The
       only way to tell them apart is the section heading above each. -->
  <h1>My Experience</h1>

  <section>
    <h3>Work Experience</h3>
    <p>Please provide details of your prior work experience here.</p>
    <div id="workPanels"></div>
    <button id="addWork" data-automation-id="add-button" type="button">Add</button>
  </section>

  <section>
    <h3>Education</h3>
    <p>Please enter at least the first 4 letters of your School or University.</p>
    <div id="eduPanels"></div>
    <button id="addEdu" data-automation-id="add-button" type="button">Add</button>
  </section>

  <section>
    <h3>Certifications/Licenses</h3>
    <p>Tell us about any professional certifications or licenses you hold.</p>
    <div id="certPanels"></div>
    <button id="addCert" data-automation-id="add-button" type="button">Add</button>
  </section>

  <button data-automation-id="bottom-navigation-next-button">Save and Continue</button>

  <script>
    // Each "Add" renders its panel ASYNCHRONOUSLY, inside its own section
    // (before that section's Add button), exactly like Workday.
    let w = 0;
    document.getElementById("addWork").addEventListener("click", () => {
      const n = ++w;
      const d = document.createElement("div");
      d.className = "formField";
      d.innerHTML =
        '<label for="wt' + n + '">Job Title</label><input id="wt' + n + '" type="text" />' +
        '<label for="wc' + n + '">Company</label><input id="wc' + n + '" type="text" />';
      setTimeout(() => document.getElementById("workPanels").appendChild(d), 200);
    });
    let e = 0;
    document.getElementById("addEdu").addEventListener("click", () => {
      const n = ++e;
      const d = document.createElement("div");
      d.className = "formField";
      d.innerHTML = '<label for="es' + n + '">School</label><input id="es' + n + '" type="text" />';
      setTimeout(() => document.getElementById("eduPanels").appendChild(d), 200);
    });
    // Certifications intentionally has no filler yet — its Add must NOT be
    // clicked by the experience/education logic.
    let c = 0;
    document.getElementById("addCert").addEventListener("click", () => {
      const n = ++c;
      const d = document.createElement("div");
      d.className = "formField";
      d.innerHTML = '<label for="cn' + n + '">Certification</label><input id="cn' + n + '" type="text" />';
      setTimeout(() => document.getElementById("certPanels").appendChild(d), 200);
    });
  </script>
</body>
</html>
