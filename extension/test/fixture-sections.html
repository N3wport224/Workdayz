<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mock Workday — My Experience (empty sections)</title>
  <style>
    [role="listbox"] { border: 1px solid #999; list-style: none; padding: 4px; margin: 0; }
    [role="option"] { cursor: pointer; padding: 2px 6px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <!-- Mimics Xcel's "My Experience" step: each section starts EMPTY with a
       bare "Add" button; all three Add buttons have identical text and are
       told apart only by the heading above them. After the first add, the
       button RELABELS to "Add Another" (same element). Education's School is
       a type-ahead combobox and Degree is a listbox button — both are the
       kinds of control findFillableFields() excludes, which is exactly what
       broke panel detection on the real site. -->
  <h1>My Experience</h1>

  <section>
    <h3>Work Experience</h3>
    <p>Please provide details of your prior work experience here.</p>
    <div id="workPanels"></div>
    <button id="addWork" data-automation-id="add-button" type="button">Add</button>
  </section>

  <section>
    <h3>Education</h3>
    <p>Please enter at least the first 4 letters of your School or University.</p>
    <div id="eduPanels"></div>
    <button id="addEdu" data-automation-id="add-button" type="button">Add</button>
  </section>

  <section>
    <h3>Certifications/Licenses</h3>
    <p>Tell us about any professional certifications or licenses you hold.</p>
    <div id="certPanels"></div>
    <button id="addCert" data-automation-id="add-button" type="button">Add</button>
  </section>

  <button data-automation-id="bottom-navigation-next-button">Save and Continue</button>

  <script>
    // --- Work Experience: plain Job Title + Company inputs, async render,
    //     button relabels to "Add Another" after the first add. ---
    let w = 0;
    document.getElementById("addWork").addEventListener("click", () => {
      const n = ++w;
      const d = document.createElement("div");
      d.className = "panel";
      // Dates are labeled "From"/"To" (Xcel's wording), split Month/Year.
      d.innerHTML =
        '<label for="wt' + n + '">Job Title</label><input id="wt' + n + '" type="text" />' +
        '<label for="wc' + n + '">Company</label><input id="wc' + n + '" type="text" />' +
        '<div data-automation-id="formField-from"><label>From</label>' +
        '<input id="wfm' + n + '" aria-label="Month" data-automation-id="dateSectionMonth-input" type="text" />' +
        '<input id="wfy' + n + '" aria-label="Year" data-automation-id="dateSectionYear-input" type="text" /></div>' +
        '<div data-automation-id="formField-to"><label>To</label>' +
        '<input id="wtm' + n + '" aria-label="Month" data-automation-id="dateSectionMonth-input" type="text" />' +
        '<input id="wty' + n + '" aria-label="Year" data-automation-id="dateSectionYear-input" type="text" /></div>' +
        '<label><input id="wcur' + n + '" type="checkbox" /> I currently work here</label>';
      setTimeout(() => {
        document.getElementById("workPanels").appendChild(d);
        document.getElementById("addWork").textContent = "Add Another"; // relabel, same element
      }, 250);
    });

    // --- Education: School is a type-ahead COMBOBOX, Degree is a LISTBOX
    //     button. Both are excluded from findFillableFields(). ---
    let e = 0;
    document.getElementById("addEdu").addEventListener("click", () => {
      const n = ++e;
      const d = document.createElement("div");
      d.className = "panel";
      d.innerHTML =
        '<label id="esl' + n + '" for="es' + n + '">School or University</label>' +
        '<input id="es' + n + '" role="combobox" aria-autocomplete="list" aria-labelledby="esl' + n + '" type="text" />' +
        '<ul id="eso' + n + '" role="listbox" class="hidden">' +
        '<li role="option">State University</li><li role="option">City College</li></ul>' +
        '<label id="edl' + n + '">Degree</label>' +
        '<button id="edb' + n + '" aria-haspopup="listbox" aria-labelledby="edl' + n + '" type="button">Select One</button>' +
        '<ul id="edo' + n + '" role="listbox" class="hidden"><li role="option">Bachelor of Science</li><li role="option">Bachelor of Arts</li></ul>' +
        '<label for="ef' + n + '">Field of Study</label><input id="ef' + n + '" type="text" />';
      setTimeout(() => {
        document.getElementById("eduPanels").appendChild(d);
        document.getElementById("addEdu").textContent = "Add Another";
        wireCombobox(d.querySelector("#es" + n), d.querySelector("#eso" + n));
        wireListbox(d.querySelector("#edb" + n), d.querySelector("#edo" + n));
      }, 250);
    });

    // Certifications intentionally has no filler yet — its Add must NOT fire.
    let c = 0;
    document.getElementById("addCert").addEventListener("click", () => {
      const n = ++c;
      const d = document.createElement("div");
      d.innerHTML = '<label for="cn' + n + '">Certification</label><input id="cn' + n + '" type="text" />';
      setTimeout(() => document.getElementById("certPanels").appendChild(d), 250);
    });

    function wireCombobox(input, options) {
      input.addEventListener("input", () => {
        const q = input.value.toLowerCase();
        let any = false;
        options.querySelectorAll('[role="option"]').forEach((opt) => {
          const show = q && opt.textContent.toLowerCase().includes(q);
          opt.style.display = show ? "" : "none";
          if (show) any = true;
        });
        options.classList.toggle("hidden", !any);
      });
      options.querySelectorAll('[role="option"]').forEach((opt) => {
        opt.addEventListener("click", () => {
          input.value = opt.textContent;
          input.dataset.committed = opt.textContent;
          options.classList.add("hidden");
        });
      });
    }
    function wireListbox(btn, list) {
      btn.addEventListener("click", () => list.classList.toggle("hidden"));
      list.querySelectorAll('[role="option"]').forEach((opt) => {
        opt.addEventListener("click", () => {
          btn.textContent = opt.textContent;
          list.classList.add("hidden");
        });
      });
    }
  </script>
</body>
</html>
