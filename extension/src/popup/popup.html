<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Workdayz</title>
    <style>
      body {
        width: 300px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 14px;
        color: #111827;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      section {
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 1px solid #e5e7eb;
      }
      section:last-child {
        border-bottom: none;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        opacity: 0.7;
        margin-bottom: 4px;
      }
      input,
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font-size: 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        margin-bottom: 6px;
      }
      button {
        width: 100%;
        font-size: 12px;
        font-weight: 600;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 8px 10px;
        cursor: pointer;
      }
      button.secondary {
        background: #e5e7eb;
        color: #111827;
      }
      textarea {
        font-family: inherit;
        resize: vertical;
      }
      #status,
      #profileStatus,
      #rulesStatus,
      #autofillStatus {
        font-size: 12px;
        opacity: 0.85;
        margin-top: 6px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>Workdayz</h1>

    <section>
      <label for="webAppUrl">Web app URL</label>
      <input id="webAppUrl" type="text" placeholder="http://localhost:3000" />
      <button id="connectBtn">Connect</button>
      <div id="connectStatus"></div>
    </section>

    <section>
      <button id="openAppBtn" class="secondary">Open Workdayz web app</button>
      <div id="status">Loading current application...</div>
      <div id="profileStatus"></div>
    </section>

    <section>
      <label for="hearAboutUs">&ldquo;How did you hear about us?&rdquo; default</label>
      <input id="hearAboutUs" type="text" placeholder="e.g. LinkedIn" />
      <label for="customRules">Custom answers (one per line: field label = value)</label>
      <textarea id="customRules" rows="3" placeholder="Desired salary = 85000&#10;Notice period = 2 weeks"></textarea>
      <label for="tenantRules" id="tenantRulesLabel" style="display: none">Rules only for this site</label>
      <textarea id="tenantRules" rows="2" style="display: none" placeholder="Employee ID = N/A"></textarea>
      <button id="saveRulesBtn" class="secondary">Save answers</button>
      <div style="display: flex; gap: 6px; margin-top: 6px">
        <button id="exportRulesBtn" class="secondary" title="Copies all rules as JSON to the clipboard">Export rules</button>
        <button id="importRulesBtn" class="secondary" title="Paste a rules JSON export, then apply it">Import rules</button>
      </div>
      <textarea id="importArea" rows="3" style="display: none; margin-top: 6px" placeholder='Paste the exported rules JSON here, then click "Import rules" again'></textarea>
      <div id="rulesStatus"></div>
    </section>

    <section>
      <button id="autofillBtn">Autofill active tab</button>
      <div id="autofillStatus"></div>
    </section>

    <section>
      <button id="clearBtn" class="secondary">Clear stored application data</button>
      <div id="clearStatus"></div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
