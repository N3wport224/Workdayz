name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  web:
    name: Web app (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
      - run: npx next build
        env:
          ANTHROPIC_API_KEY: ci-placeholder

  extension:
    name: Extension (typecheck, build, DOM e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Install Chromium for DOM tests
        run: npx playwright-core install chromium --with-deps
      - name: DOM heuristics e2e
        run: npm test
